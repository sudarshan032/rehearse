<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Telugu Typing</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ccc; --chip: #f1f1f1; --accent: #0b57d0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --muted: #999; --line: #444; --chip: #262626; --accent: #8ab4f8; } }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  textarea { box-sizing: border-box; width: 100%; min-height: 160px; padding: 12px; font-size: 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  #sugg { display: flex; gap: 8px; flex-wrap: wrap; min-height: 44px; margin: 8px 0; }
  #sugg button { font-size: 20px; padding: 4px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: var(--fg); cursor: pointer; }
  #sugg button:first-child { border-color: var(--accent); }
  #status { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Telugu typing</h1>
  <p>Type Telugu in English letters (e.g. <code>vachavu</code>). Space takes the first suggestion; click to pick another. Runs entirely in your browser.</p>
  <textarea id="ta" autofocus spellcheck="false" placeholder="nenu ikkada unnanu"></textarea>
  <div id="sugg"></div>
  <div id="status">Loading model…</div>
</main>
<script type="module">
  import * as ort from 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.wasm.min.mjs';
  import { createXlit } from './xlit.js';
  ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/';
  ort.env.wasm.numThreads = 1;

  const ta = document.getElementById('ta'), sugg = document.getElementById('sugg'), status = document.getElementById('status');
  let xlit, seq = 0, current = [], currentFor = null;
  const lastWord = () => { const m = ta.value.slice(0, ta.selectionStart).match(/[A-Za-z]+$/); return m && m[0]; };

  function pick(word) {
    const end = ta.selectionStart, w = lastWord();
    if (!w) return;
    ta.setRangeText(word, end - w.length, end, 'end');
    sugg.replaceChildren(); current = []; currentFor = null;
  }
  async function update() {
    const w = lastWord(), my = ++seq;
    if (!w || !xlit) { sugg.replaceChildren(); current = []; return; }
    const t = performance.now();
    const out = (await xlit.translit(w, 3)).map(s => s.replace(/\u200c/g, ''));
    if (my !== seq) return;
    current = out; currentFor = w;
    sugg.replaceChildren(...out.map(s => Object.assign(document.createElement('button'), { textContent: s, onclick: () => { pick(s); ta.focus(); } })));
    status.textContent = `${(performance.now() - t).toFixed(0)} ms`;
  }
  ta.addEventListener('input', update);
  ta.addEventListener('keydown', async e => {
    const w = lastWord();
    if ((e.key !== ' ' && e.key !== 'Enter') || !w || !xlit) return;
    if (currentFor === w) return pick(current[0]);       // suggestions are fresh: pick, let the key through
    e.preventDefault();                                   // still computing: finish this word first
    const [best] = await xlit.translit(w, 1);
    if (lastWord() === w) { pick(best.replace(/\u200c/g, '')); ta.setRangeText(e.key === ' ' ? ' ' : '\n', ta.selectionStart, ta.selectionStart, 'end'); }
  });

  try {
    const t = performance.now();
    xlit = await createXlit({ ort, base: 'model/', quant: 'int8' });
    status.textContent = `Ready (loaded in ${((performance.now() - t) / 1000).toFixed(1)} s)`;
    update();
  } catch (e) { status.textContent = 'Failed to load: ' + e.message; }
</script>
</body>
</html>
